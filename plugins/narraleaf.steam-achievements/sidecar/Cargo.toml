[package]
name = "nl-steam-bridge"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "NDJSON-over-stdio bridge between a NarraLeaf game and the Steamworks API."
publish = false

[[bin]]
name = "nl-steam-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned deliberately: the safe wrapper's shape changed across releases (0.10
# handed out a separate `SingleClient` for callback pumping, 0.11 folded it into
# `Client`). This source is written against 0.11. Bumping it is a code change,
# not a version bump — see sidecar/README.md "Verification status".
steamworks = "=0.11.0"
steamworks-sys = "=0.11.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
